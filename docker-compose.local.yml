services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: faianaya-backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: "postgresql://faianaya:faianaya123@postgres:5432/faianaya_coffee?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "faianaya-super-secret-jwt-key-change-in-production"
      JWT_EXPIRES_IN: "7d"
      PORT: "3001"
      CORS_ORIGIN: "http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: faianaya-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3001/api"
      NEXT_PUBLIC_WS_URL: "ws://localhost:3001"
    depends_on:
      - backend
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data: